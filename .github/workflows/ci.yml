name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cleads
          POSTGRES_PASSWORD: cleads
          POSTGRES_DB: cleads_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cleads" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://cleads:cleads@localhost:5432/cleads_test?sslmode=disable
      - run: go test -run '^$' -bench . -benchtime 200ms ./internal/...
      - run: docker build -t cleads-extractor:ci .
