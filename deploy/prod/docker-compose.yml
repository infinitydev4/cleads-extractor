# Production stack for a single VPS: PostgreSQL + API + worker + Caddy (TLS).
# Lives in /opt/cleads next to a .env created by init-env.sh. Deployed by
# deploy.sh (see docs/DEPLOY_VPS.md).
name: cleads

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-app-env: &app-env
  APP_ENV: production
  DATABASE_URL: postgres://cleads:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/cleads?sslmode=disable
  DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
  LOG_FORMAT: json
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_KEYS: ${API_KEYS:?set API_KEYS in .env}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  PUBLIC_URL: ${PUBLIC_URL:-}
  GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-CLEADS-Business-Extractor/1.0}
  GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
  ENABLE_GMAPS_SCRAPING: ${ENABLE_GMAPS_SCRAPING:-true}
  GMAPS_DETAILS: ${GMAPS_DETAILS:-true}
  GMAPS_PROXIES: ${GMAPS_PROXIES:-}
  ENABLE_OSM: ${ENABLE_OSM:-true}
  OVERPASS_URL: ${OVERPASS_URL:-}
  ENABLE_SIRENE: ${ENABLE_SIRENE:-true}
  ENRICH_ENABLED: ${ENRICH_ENABLED:-true}
  ENRICH_CONCURRENCY: ${ENRICH_CONCURRENCY:-8} # the crawl is CPU-bound (regexes): sized for 2 vCPU
  ENRICH_MAX_PAGES: ${ENRICH_MAX_PAGES:-4}
  SOURCE_RATE: ${SOURCE_RATE:-}
  SOURCE_CONCURRENCY: ${SOURCE_CONCURRENCY:-}
  MAX_CELLS_PER_JOB: ${MAX_CELLS_PER_JOB:-2500}
  MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}

x-app: &app
  image: ${IMAGE:-ghcr.io/infinitydev4/cleads-extractor}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  stop_grace_period: 40s # SHUTDOWN_WINDOW (25s) + margin: in-flight tasks finish

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cleads
    # Sized for a 4 GB host shared with the app (about 1.3 GB for the database).
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=2GB
      - -c
      - log_min_duration_statement=1000
    shm_size: 256mb
    mem_limit: 1280m
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleads -d cleads"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    # No published port: only reachable on the compose network.

  api:
    <<: *app
    environment:
      <<: *app-env
      ROLE: api
      WORKER_ID: api-1
    ports: ["127.0.0.1:8080:8080"] # loopback only: Caddy and deploy.sh
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/local/bin/cleads-extractor", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    environment:
      <<: *app-env
      ROLE: worker
      WORKER_ID: worker-1
    ports: ["127.0.0.1:8081:8080"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "/usr/local/bin/cleads-extractor", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
