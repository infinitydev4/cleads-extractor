openapi: 3.1.0
info:
  title: CLEADS Business Extractor API
  version: "1.0.0"
  description: |
    Discover, extract, normalize, deduplicate, enrich and export business
    listings by activity sector and geographic area.

    **Flow**: `POST /v1/jobs` → follow `GET /v1/jobs/{id}/events` (SSE) or poll
    `GET /v1/jobs/{id}` → read results progressively with
    `GET /v1/jobs/{id}/businesses?cursor=…` → export with
    `GET /v1/jobs/{id}/export?format=csv`.

    **Throughput counters** are reported separately: `raw_found` (everything
    sources returned), `unique` (after deduplication), `complete` (identity,
    address, phone and website/email) and `crm_useful` (operating and
    reachable by at least one channel).
servers:
  - url: /
security:
  - bearer: []
  - apiKey: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    apiKey: { type: apiKey, in: header, name: X-API-Key }
  parameters:
    JobID: { name: id, in: path, required: true, schema: { type: string } }
    Cursor: { name: cursor, in: query, schema: { type: string }, description: Opaque cursor returned as next_cursor. }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
    MinCompleteness: { name: min_completeness, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
    HasPhone: { name: has_phone, in: query, schema: { type: boolean } }
    HasEmail: { name: has_email, in: query, schema: { type: boolean } }
    HasWebsite: { name: has_website, in: query, schema: { type: boolean } }
    Useful: { name: useful, in: query, schema: { type: boolean }, description: Only CRM-useful records. }
    City: { name: city, in: query, schema: { type: string } }
    PostalCode: { name: postal_code, in: query, schema: { type: string }, description: Prefix match, e.g. "69" or "69003". }
    Category: { name: category, in: query, schema: { type: string } }
    Q: { name: q, in: query, schema: { type: string }, description: Name contains. }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
    BBox:
      type: object
      required: [min_lat, min_lng, max_lat, max_lng]
      properties:
        min_lat: { type: number }
        min_lng: { type: number }
        max_lat: { type: number }
        max_lng: { type: number }
    JobSpec:
      type: object
      properties:
        query: { type: string, example: plombier, description: Free-text activity. One of query or sector is required. }
        sector: { type: string, example: plumber, description: Taxonomy key from GET /v1/sectors. }
        location: { type: string, example: "Lyon, France", description: Geocoded to a bounding box. }
        bbox: { $ref: "#/components/schemas/BBox" }
        center:
          type: object
          properties: { lat: { type: number }, lng: { type: number } }
        radius_m: { type: number, maximum: 100000 }
        country: { type: string, description: "ISO 3166-1 alpha-2. Optional: by default the country of the geocoded location (worldwide search). Set it to disambiguate (e.g. AE)." }
        language: { type: string, default: fr }
        sources:
          type: array
          items: { type: string, enum: [google_maps_http, google_maps_browser, google_places, osm, sirene, mock] }
          description: "Defaults to every enabled source. google_maps_http (scraping, no API key) is enabled by default."
        grid_cell_km: { type: number, description: "0 = per-source default. Cells saturating a source are split automatically." }
        max_results: { type: integer, description: Stop once this many unique businesses are found. }
        enrich: { type: boolean, description: Crawl websites for emails, social profiles and SIRET. }
        include_unrelated: { type: boolean, description: "Keep the unrelated nearby places Google Maps appends to results (dropped by default)." }
        webhook_url: { type: string, format: uri, description: "POSTed on completion, signed with X-Cleads-Signature: sha256=HMAC(secret, timestamp + '.' + body)." }
        priority: { type: integer }
    Counters:
      type: object
      properties:
        tasks_total: { type: integer }
        tasks_done: { type: integer }
        tasks_failed: { type: integer }
        raw_found: { type: integer }
        unique: { type: integer }
        complete: { type: integer }
        crm_useful: { type: integer }
        enriched: { type: integer }
    Job:
      type: object
      properties:
        id: { type: string }
        spec: { $ref: "#/components/schemas/JobSpec" }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        counters: { $ref: "#/components/schemas/Counters" }
        error: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    Business:
      type: object
      properties:
        id: { type: integer }
        seq: { type: integer, description: Position in the job (listing only). }
        name: { type: string }
        category: { type: string }
        categories: { type: array, items: { type: string } }
        address: { type: string }
        street: { type: string }
        postal_code: { type: string }
        city: { type: string }
        region: { type: string }
        country: { type: string }
        lat: { type: number }
        lng: { type: number }
        phone: { type: string, description: E.164 when it could be normalized. }
        website: { type: string }
        domain: { type: string }
        emails: { type: array, items: { type: string } }
        socials:
          type: object
          properties:
            linkedin: { type: string }
            facebook: { type: string }
            instagram: { type: string }
            x: { type: string }
            youtube: { type: string }
            tiktok: { type: string }
        rating: { type: number }
        reviews_count: { type: integer }
        status: { type: string, enum: [OPERATIONAL, CLOSED_TEMPORARILY, CLOSED_PERMANENTLY] }
        place_id: { type: string }
        cid: { type: string }
        osm_id: { type: string }
        siren: { type: string }
        siret: { type: string }
        naf: { type: string }
        sources: { type: array, items: { type: string } }
        completeness: { type: integer, minimum: 0, maximum: 100 }
        source_url: { type: string }
    Task:
      type: object
      properties:
        id: { type: integer }
        job_id: { type: string }
        kind: { type: string, enum: [plan, search, details, enrich] }
        source: { type: string, description: "Queue: a source name, <source>.details, _plan or _enrich." }
        payload: { type: object }
        priority: { type: integer }
        attempts: { type: integer }
        status: { type: string, enum: [pending, running, failed] }
        run_after: { type: string, format: date-time }
        last_error: { type: string }
    LogEvent:
      type: object
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        level: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
        msg: { type: string }
        job_id: { type: string }
        task_id: { type: integer }
        source: { type: string }
        worker: { type: string }
        attrs: { type: object }
    JobErrors:
      type: object
      properties:
        job_id: { type: string }
        status: { type: string }
        job_error: { type: string }
        tasks_failed: { type: integer }
        tasks_retrying: { type: integer }
        summary: { type: string, example: "12 × http 500 on google_maps_http.details (failed)" }
        groups:
          type: array
          items:
            type: object
            properties:
              count: { type: integer }
              kind: { type: string, enum: [failed_task, retrying_task, event] }
              source: { type: string }
              cause: { type: string }
              example: { type: string }
              last_seen: { type: string, format: date-time }
              task_ids: { type: array, items: { type: integer } }
    OutcomeCounts:
      type: object
      properties:
        ok: { type: integer }
        error: { type: integer }
        rate_limited: { type: integer }
        blocked: { type: integer }
        permanent: { type: integer }
    HealthSummary:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        summary: { type: string, description: One finding per line. }
        checked_at: { type: string, format: date-time }
        database:
          type: object
          properties: { ok: { type: boolean }, latency_ms: { type: number }, error: { type: string } }
        queue:
          type: object
          properties:
            pending: { type: object, additionalProperties: { type: integer } }
            running: { type: integer }
        jobs: { type: object, additionalProperties: { type: integer } }
        workers:
          type: array
          items:
            type: object
            properties: { id: { type: string }, role: { type: string }, version: { type: string }, seen_at: { type: string, format: date-time } }
        sources:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              verdict: { type: string, enum: [ok, idle, throttled, blocked, failing, no_worker] }
              detail: { type: string }
              circuit_open: { type: boolean }
              circuit_open_until: { type: string, format: date-time }
              rate: { type: number, description: Current adaptive rate summed over workers (req/s). }
              base_rate: { type: number }
              workers: { type: integer }
              in_flight: { type: integer }
              pending: { type: integer }
              recent: { $ref: "#/components/schemas/OutcomeCounts" }
              error_rate: { type: number }
              window_seconds: { type: integer }
        recent_errors: { type: array, items: { $ref: "#/components/schemas/LogEvent" } }
        recent_error_count: { type: integer }
        recent_window: { type: string }
paths:
  /healthz:
    get: { summary: Liveness, security: [], responses: { "200": { description: OK } } }
  /readyz:
    get: { summary: Readiness (database reachable), security: [], responses: { "200": { description: Ready }, "503": { description: Not ready } } }
  /v1/sources:
    get: { summary: Enabled sources and their operational profile, responses: { "200": { description: OK } } }
  /v1/sectors:
    get: { summary: Sector taxonomy (Google types, OSM tags, NAF codes), responses: { "200": { description: OK } } }
  /v1/jobs:
    post:
      summary: Submit an extraction job
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string }, description: Replays return the original job. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobSpec" }
            example: { query: plombier, location: "Lyon, France", enrich: true, max_results: 2000 }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { $ref: "#/components/schemas/Job" }
                  planned_sources: { type: array, items: { type: string } }
                  skipped_sources: { type: object, additionalProperties: { type: string } }
                  links: { type: object, additionalProperties: { type: string } }
        "200": { description: "Idempotent replay (same body, replayed: true)" }
        "400": { description: Invalid JSON, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: Invalid spec, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      summary: List jobs (newest first)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: OK } }
  /v1/jobs/{id}:
    get:
      summary: Job status and counters
      parameters: [{ $ref: "#/components/parameters/JobID" }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
    delete:
      summary: Cancel a job
      parameters: [{ $ref: "#/components/parameters/JobID" }]
      responses: { "200": { description: Cancelled }, "409": { description: Already finished } }
  /v1/jobs/{id}/businesses:
    get:
      summary: Results so far, cursor-paginated (poll with next_cursor for new records)
      parameters:
        - { $ref: "#/components/parameters/JobID" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/MinCompleteness" }
        - { $ref: "#/components/parameters/HasPhone" }
        - { $ref: "#/components/parameters/HasEmail" }
        - { $ref: "#/components/parameters/HasWebsite" }
        - { $ref: "#/components/parameters/Useful" }
        - { $ref: "#/components/parameters/City" }
        - { $ref: "#/components/parameters/PostalCode" }
        - { $ref: "#/components/parameters/Category" }
        - { $ref: "#/components/parameters/Q" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Business" } }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
                  job_status: { type: string }
                  counters: { $ref: "#/components/schemas/Counters" }
  /v1/jobs/{id}/events:
    get:
      summary: Server-Sent Events progress stream (event progress, then done)
      parameters:
        - { $ref: "#/components/parameters/JobID" }
        - { name: interval_ms, in: query, schema: { type: integer, minimum: 250, maximum: 10000, default: 1000 } }
      responses: { "200": { description: text/event-stream } }
  /v1/jobs/{id}/export:
    get:
      summary: Streamed export (works while the job is running)
      parameters:
        - { $ref: "#/components/parameters/JobID" }
        - { name: format, in: query, schema: { type: string, enum: [csv, csv-excel, jsonl], default: csv } }
        - { $ref: "#/components/parameters/MinCompleteness" }
        - { $ref: "#/components/parameters/HasPhone" }
        - { $ref: "#/components/parameters/HasEmail" }
        - { $ref: "#/components/parameters/Useful" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 }, description: "Chunk mode: return at most this many rows after cursor instead of the whole stream. The CSV header is sent only when cursor is 0, so chunks concatenate into one file." }
        - { name: cursor, in: query, schema: { type: string }, description: "Chunk mode: X-Next-Cursor of the previous chunk (0 for the first)." }
        - { name: max_bytes, in: query, schema: { type: integer, minimum: 1024, maximum: 1048576 }, description: "Chunk mode: byte budget (whole rows only)." }
      responses:
        "200":
          description: "File stream. In chunk mode, headers X-Next-Cursor, X-Export-Rows and X-Export-Done describe the chunk."
  /v1/jobs/{id}/tasks:
    get:
      summary: Remaining tasks of a job (diagnostics)
      description: |
        Successful tasks are deleted from the queue, so this lists pending,
        running and failed tasks only, failed first. `last_error` is redacted
        (credentials masked).
      parameters:
        - { $ref: "#/components/parameters/JobID" }
        - { name: status, in: query, schema: { type: string, enum: [failed, pending, running] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
        "404": { description: Not found (or another key's job) }
  /v1/jobs/{id}/errors:
    get:
      summary: Why a job failed — failures grouped by cause
      description: |
        Combines failed tasks, retrying tasks (their last error) and the
        job's warning/error events, grouped by normalized cause (ids, URLs and
        timestamps folded), e.g. "12 × http 500 on google_maps_http.details".
      parameters: [{ $ref: "#/components/parameters/JobID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobErrors" }
        "404": { description: Not found (or another key's job) }
  /v1/logs:
    get:
      summary: Warnings and errors of every process (admin key only)
      description: |
        Reads the `events` table, filled asynchronously by every API and worker
        process (WARN and above, kept EVENTS_RETENTION). With `local=true`,
        reads instead the in-memory ring of recent records (INFO and above) of
        the replica serving the request. Secrets are masked. Other keys get 403:
        logs mix every client.
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error], default: warn }, description: Minimum level. }
        - { name: job_id, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string }, description: "Queue name (google_maps_http.details), or a prefix ending with * (google_maps_http*)." }
        - { name: since, in: query, schema: { type: string }, description: "RFC 3339 time or a duration back from now (15m, 2h)." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: local, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string, enum: [database, process] }
                  events: { type: array, items: { $ref: "#/components/schemas/LogEvent" } }
        "403": { description: Not the admin key }
  /v1/health/summary:
    get:
      summary: Aggregated health — answers "is Google blocking us?"
      description: |
        Database reachability, queue depth by source, live workers (heartbeats
        every 10 s), and per source: circuit breaker state, current vs.
        configured adaptive rate, request outcomes over the last 5 minutes and
        a verdict (ok, idle, throttled, blocked, failing, no_worker).
        `recent_errors` (last warnings/errors) is filled for the admin key only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthSummary" }
  /v1/businesses:
    get:
      summary: Search the consolidated prospecting base (all jobs, deduplicated)
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/MinCompleteness" }
        - { $ref: "#/components/parameters/HasPhone" }
        - { $ref: "#/components/parameters/HasEmail" }
        - { $ref: "#/components/parameters/Useful" }
        - { $ref: "#/components/parameters/City" }
        - { $ref: "#/components/parameters/PostalCode" }
        - { $ref: "#/components/parameters/Category" }
        - { $ref: "#/components/parameters/Q" }
      responses: { "200": { description: OK } }
  /v1/businesses/{id}:
    get:
      summary: One business
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /v1/stats:
    get: { summary: Global counters and queue depth, responses: { "200": { description: OK } } }
  /metrics:
    get: { summary: Prometheus metrics, responses: { "200": { description: OK } } }
